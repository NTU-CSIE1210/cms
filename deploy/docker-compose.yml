services:
  cms:
    build:
      context: .
      dockerfile: Dockerfile
    cgroup_parent: isolate.slice
    container_name: cms_sample_exam2
    restart: unless-stopped
    ports:
      - "48763:8888"
      - "48764:8889"
    volumes:
      - /sys/fs/cgroup/unified:/sys/fs/cgroup/unified:rw
      - /var/lib/isolate:/var/lib/isolate
      - cms_pg_sample_exam2:/var/lib/postgresql/data
      - cms_install_sample_exam2:/opt/cms/install
    environment:
      - TZ=Asia/Taipei
      - SRC_DIR=/home/cmsuser/src
      - CMS_DB_NAME=cmsdb
      - CMS_DB_USER=cmsuser
      - CMS_DB_PASS=TBxwHoAktAktEleLW
    # Run the image's init script so Postgres is initialized and CMS is set up
    command: ["/usr/local/bin/start-cms"]
volumes:
  cms_pg_sample_exam2:
  cms_install_sample_exam2:
